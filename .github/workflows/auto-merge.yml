# Автоматическая публикация: любая ветка, отправленная в GitHub (в том числе автопушем из Claude Code),
# проходит проверку (типы, сборка демо и серверные тесты на PostgreSQL), затем для неё создаётся pull request, и он сразу вливается в main.
# Сайт на GitHub Pages обновляется после вливания. Если проверка упала, в main ничего не попадает.
# Разрешено владельцем репозитория (Sofeir) 20.10.2026.
name: Auto merge to main

on:
  push:
    branches-ignore: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: servicedesk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:demo
      # обычная сборка нужна для установки на сервер (Docker): без проверки она может незаметно сломаться
      - run: npm run build
      - name: Серверные тесты
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/servicedesk_test
        run: npm test
      # Установка на сервер: собираем образ и поднимаем оба контейнера (приложение и nginx) так же, как на сервере
      - name: Docker, сборка и запуск
        run: |
          sudo mkdir -p /var/lib/servicedesk/uploads
          cat > .env <<EOT
          DATABASE_URL=postgres://postgres@localhost:5432/servicedesk_test
          API_PORT=8431
          PUBLIC_URL=http://localhost
          ALLOWED_ORIGINS=http://localhost
          COOKIE_SECURE=false
          EOT
          docker compose config -q
          docker compose up -d --build
          for i in $(seq 1 30); do
            curl -fs -o /dev/null http://localhost/ && break
            sleep 2
          done
          docker compose ps
          echo "--- сайт через nginx"
          echo "главная: $(curl -fsS -o /dev/null -w '%{http_code}' http://localhost/)"
          echo "страница сайта: $(curl -fsS -o /dev/null -w '%{http_code}' http://localhost/orders)"
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/auth/me)
          echo "API без входа: $code"
          [ "$code" = "401" ]
          docker compose exec -T nginx nginx -t
      - name: Docker, журналы при сбое
        if: failure()
        run: docker compose logs --tail 80
      - name: Docker, остановка
        if: always()
        run: docker compose down || true
      - name: Pull request и слияние
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${GITHUB_REF_NAME}"
          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then
            echo "В ветке нет новых коммитов относительно main, вливать нечего."
            exit 0
          fi
          # Смотрим только открытые PR: у ветки может остаться старый, уже влитый, и тогда новый нужен.
          if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" = "0" ]; then
            gh pr create --base main --head "$branch" \
              --title "$(git log -1 --pretty=%s)" \
              --body "Создан автоматически после проверки: типы и сборка демо прошли."
          fi
          gh pr merge "$branch" --merge
          # Слияние токеном Actions не запускает другие workflow само, поэтому публикацию сайта запускаем явно.
          gh workflow run pages.yml --ref main
