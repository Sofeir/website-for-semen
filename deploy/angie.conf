# Angie перед приложением: принимает запросы на 80 порту и отдаёт их приложению (контейнер app, порт 8431).
# Angie совместим с nginx по настройкам.

# Адрес приложения Docker выдаёт по имени «app». При обновлении контейнер получает новый адрес,
# поэтому имя разбираем при каждом запросе (resolver), а не один раз при запуске.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;

    set $app_upstream app:8431;

    # вложения до 15 МБ, запас на заголовки формы
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Живые уведомления (SSE): ответ нельзя копить в буфере и нельзя обрывать по таймауту
    location /api/events {
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # адрес клиента перезаписываем, а не дописываем: подставить чужой адрес в заголовке нельзя
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

