# Три контейнера: база данных (PostgreSQL), приложение (сайт и сервер) и прокси Angie.
# Всё хранится в томах Docker: pgdata (база) и uploads (вложения). Пароль базы задаётся в .env (DB_PASSWORD).
name: servicedesk

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: servicedesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в файле .env}
      POSTGRES_DB: servicedesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Для pgAdmin: только с самого сервера (порт 5433, чтобы не мешать другим базам на сервере).
    # С другого компьютера подключаются через SSH-туннель.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicedesk -d servicedesk"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  app:
    build: .
    image: servicedesk-app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: "8431"
      DATABASE_URL: postgres://servicedesk:${DB_PASSWORD:?Задайте DB_PASSWORD в файле .env}@db:5432/servicedesk
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  angie:
    image: docker.angie.software/angie:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/angie.conf:/etc/angie/http.d/default.conf:ro
      # для https (см. УСТАНОВКА-НА-СЕРВЕР.md): сертификат лежит на сервере в /etc/servicedesk-ssl
      - /etc/servicedesk-ssl:/etc/ssl/servicedesk:ro
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
